[project]
name = "img-gen-backend"
version = "0.1.0"
description = "Local presentation image generator API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=5.3.1",
    "sqlmodel>=0.0.48",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
gpu = [
    "accelerate>=1.6.0",
    "safetensors>=0.5.3",
    "spandrel>=0.4.1",
    "torch>=2.8.0",
    "transformers>=5.17.0",
    "peft>=0.15.0",
    "torchao>=0.10.0",
]

[project.scripts]
img-gen-api = "app.cli:run_api"
img-gen-worker = "app.cli:run_worker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app.core"]

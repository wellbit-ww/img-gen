workers:
  - gpu: 0
    queues: [quality, edit]
    model: qwen-image-2.1
    memory: text_encoder_offload
    tf32: true
    vae_tiling: true
    torch_compile: false
    enabled: true
  - gpu: 1
    queues: [draft, batch]
    model: qwen-image-2.1-turbo
    memory: text_encoder_offload
    tf32: true
    vae_tiling: true
    enabled: true
  - gpu: 2
    queues: [alt, batch]
    model: flux-alt
    enabled: false
  - gpu: 3
    # batch_parent and lora are lightweight orchestrator queues (no GPU work, max_jobs=8)
    queues: [upscale, bgremove, batch_parent, lora]
    model: utils
    enabled: true

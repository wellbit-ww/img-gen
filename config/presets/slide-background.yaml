id: slide-background
name: "Фон для слайда"
default_aspect: "16:9"
transparent: false
text_mode: overlay
free_side: left
description: "Минималистичный корпоративный фон с местом под заголовок"
prompt_template: >
  {subject}. Clean minimal corporate presentation background, generous empty
  negative space on the {free_side} side for title text, soft gradient lighting,
  modern high-end style, color palette {palette}, no text, no watermark.
negative: "text, letters, watermark, logo, clutter, busy background, people faces"
steps:
  draft: 8
  standard: 30
  high: 50
guidance: 1.0

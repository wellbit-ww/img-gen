# Production override for the GPU server:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  api:
    environment:
      ENGINE_MODE: real
      OLLAMA_URL: http://ollama:11434
    volumes:
      - models_data:/models:ro
    depends_on:
      ollama:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      ENGINE_MODE: real
      MODELS_DIR: /models
      OLLAMA_URL: http://ollama:11434
      HF_HOME: /models/hf
    volumes:
      - models_data:/models
    shm_size: "16gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      start_period: 300s

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  trainer:
    profiles: [training]
    build:
      context: .
      dockerfile: docker/Dockerfile.trainer
    volumes:
      - models_data:/models
      - app_data:/data
    environment:
      HF_HOME: /models/hf
      HF_TOKEN: ${HF_TOKEN:-}
    shm_size: "16gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  models_data:
    name: models_data
  ollama_data:
